[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finmate"
version = "0.1.0"
description = "FinMate AI - a multi-agent personal finance assistant (local, no cloud infra required)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "openai>=1.50.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.6.0",
    "streamlit>=1.38.0",
    "chromadb>=1.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pandas>=2.2.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
