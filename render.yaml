# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend only (backend/). The frontend (frontend/)
# is a static Next.js app and belongs on Vercel instead -- see
# DEPLOYMENT.md for both halves and why they're split this way.
#
# Using this file: push it to your repo's root, then in the Render
# Dashboard choose "New +" -> "Blueprint" and point it at your repo.
# Render finds this file automatically. You'll be prompted for the one
# `sync: false` value below (your LLM provider's API key) since Render
# never stores secrets in a file you might commit to Git.
#
# Persistent disk: NOT included below, because free-tier services can't
# have one at all (Render requires Starter or higher for a disk) -- see
# DEPLOYMENT.md's "Persistence, cost, and what's realistic". That means
# data/finmate.db and the optional Qdrant vector index live only on the
# container's local, ephemeral disk: they reset to empty on every
# restart, redeploy, or free-tier spin-down/spin-up. Fine for a
# portfolio/demo deployment -- just re-run POST /api/users/seed-demo-data
# (or click "Load demo data" in the frontend) afterward. If you want real
# persistence, switch to the Starter plan (~$7/mo) and uncomment the
# `disk:` block at the bottom of this file.

services:
  - type: web
    name: finmate-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: FINMATE_LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # you'll be prompted for this in the Render dashboard
      - key: FINMATE_FRONTEND_ORIGINS
        value: https://your-frontend.vercel.app # update after your Vercel deploy -- see DEPLOYMENT.md
      - key: FINMATE_DB_PATH
        value: /app/data/finmate.db
      - key: FINMATE_QDRANT_PATH
        value: /app/data/qdrant_store
      - key: FINMATE_WARM_UP_ON_STARTUP
        value: "true"
      - key: ENABLE_RERANKER
        value: "false" # cross-encoder reranking off -- the one thing heavy enough to OOM a 512MB free instance. See finmate/rag.py's "Performance" docstring. Set "true" once you're on a plan with memory to spare.
    # disk:                     # uncomment this block (and change `plan: free` above to `plan: starter`)
    #   name: finmate-data      # for real persistence -- data/finmate.db and the vector index otherwise
    #   mountPath: /app/data    # reset on every restart/redeploy/spin-down on the free plan (see note above).
    #   sizeGB: 1
