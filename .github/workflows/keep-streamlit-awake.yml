name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Open Streamlit app in real browser
        run: |
          python - << 'PY'
          from playwright.sync_api import sync_playwright
          import time

          url = "https://subarna.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print("Opening:", url)

              page.goto(url, wait_until="networkidle", timeout=120000)
              time.sleep(20)

              title = page.title()
              body_text = page.locator("body").inner_text(timeout=30000)

              print("Page title:", title)
              print("Body preview:")
              print(body_text[:500])

              page.screenshot(path="streamlit-check.png", full_page=True)
              browser.close()

              if "This app has gone to sleep" in body_text:
                  raise Exception("Streamlit app is still sleeping")

              print("Streamlit app opened successfully")
          PY

      - name: Upload screenshot proof
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-check-screenshot
          path: streamlit-check.png
